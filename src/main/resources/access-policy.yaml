  scope: CHECKPOINT
  captureToken: true
- method: POST
  path: /api/v1/captures/sets/{setId}/detections
  roles: [BOOTH]
  scope: BOOTH
  captureToken: false
- method: GET
  path: /api/v1/captures/sets/{setId}
  roles: [ADMIN, CUSTOMER]
  scope: CHECKPOINT
  captureToken: true
- method: GET
  path: /api/v1/captures/checkpoints/{checkpointId}/inspection
