# 생성 파일: scripts/gen_access_policy.py가 contracts OpenAPI의 x-trace-access로 만든다. 손으로 고치지 않는다.
# contracts 커밋: 981223a
rules:
- {method: GET, path: /api/v1/auth/ping, public: true}
- {method: POST, path: /api/v1/auth/signup, public: true}
- {method: POST, path: /api/v1/auth/email/verify, public: true}
- {method: POST, path: /api/v1/auth/email/resend, public: true}
- {method: POST, path: /api/v1/auth/login, public: true}
- {method: POST, path: /api/v1/auth/refresh, public: true}
- method: POST
  path: /api/v1/auth/logout
  roles: [ADMIN, CUSTOMER]
  scope: NONE
  captureToken: false
- {method: POST, path: /api/v1/auth/password/reset-request, public: true}
- {method: POST, path: /api/v1/auth/password/reset, public: true}
- method: GET
  path: /api/v1/auth/me
  roles: [ADMIN, CUSTOMER]
  scope: NONE
  captureToken: false
- method: DELETE
  path: /api/v1/auth/me
  roles: [CUSTOMER]
  scope: NONE
  captureToken: false
- method: POST
  path: /api/v1/auth/capture-links
  roles: [ADMIN]
  scope: NONE
  captureToken: false
- method: POST
  path: /api/v1/auth/capture-links/exchange
  roles: [CUSTOMER]
  scope: NONE
  captureToken: false
- {method: POST, path: /api/v1/auth/booth/token, public: true}
- method: POST
  path: /api/v1/auth/pairing-codes
  roles: [ADMIN]
  scope: NONE
  captureToken: false
- {method: POST, path: /api/v1/auth/pairing-codes/exchange, public: true}
- {method: GET, path: /api/v1/captures/ping, public: true}
- method: POST
  path: /api/v1/captures/sets
  roles: [BOOTH, CUSTOMER]
  scope: CHECKPOINT
  captureToken: true
- method: POST
  path: /api/v1/captures/sets/{setId}/uploads
