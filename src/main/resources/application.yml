# 공통 설정. 학교 클러스터 값(주소·비밀번호)은 gitops 레포의 ConfigMap trace-infra와 Secret trace-secrets가 환경 변수로 넣는다
server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true
  # 요청 제한 카운터(gitops infra.env의 REDIS_*, 비밀번호는 trace-secrets)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  cloud:
    gateway:
      server:
        webflux:
          # 무중단 교체: 뒤쪽 서버에 연결하지 못했을 때만(요청이 아직 나가지 않았으므로 모든 메서드에 안전) 다시 보낸다.
          # 서버가 낸 5xx나 응답 시간 초과는 다시 보내지 않는다(POST가 두 번 처리되지 않게).
          # 연결 시간 초과도 연결 실패라 다시 보내므로, 연결은 2초 안에 안 되면 포기해 전체 대기가 길어지지 않게 한다(같은 Docker 망이라 넉넉하다)
          httpclient:
            connect-timeout: 2000
          default-filters:
            - name: Retry
              args:
                retries: 6
                methods: GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS
                series: ""
                exceptions: java.net.ConnectException,java.net.NoRouteToHostException
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 400ms
                  factor: 2
                  basedOnPreviousValue: false
          # REST API v0의 경로 앞부분으로 서버를 고른다(GAKDO/docs design/rest-api-v0.md)
          routes:
            # GW1: 로그인 시도·페어링 코드 입력은 IP당 분당 10회(FR-AUTH-03). auth 라우트보다 먼저 맞도록 order를 낮춘다
            - id: auth-login
              uri: ${AUTH_SERVER_URL:http://auth-server:8080}
              order: -1
              predicates:
                - Path=/api/v1/auth/login
                - Method=POST
              filters:
                - IpRateLimit=login, 10, 60
            - id: auth-pairing-exchange
              uri: ${AUTH_SERVER_URL:http://auth-server:8080}
              order: -1
              predicates:
                - Path=/api/v1/auth/pairing-codes/exchange
                - Method=POST
              filters:
                - IpRateLimit=pairing, 10, 60
            # 계약 429: 가입·인증 코드 확인·재발송도 IP당 분당 10회(코드 맞히기·메일 폭탄 막기)
            - id: auth-signup
              uri: ${AUTH_SERVER_URL:http://auth-server:8080}
              order: -1
              predicates:
                - Path=/api/v1/auth/signup
                - Method=POST
              filters:
                - IpRateLimit=signup, 10, 60
            # 계약 429: 가입·인증 코드 확인·재발송도 IP당 분당 10회(코드 맞히기·메일 폭탄 막기)
            - id: auth-email-verify
              uri: ${AUTH_SERVER_URL:http://auth-server:8080}
              order: -1
              predicates:
                - Path=/api/v1/auth/email/verify
                - Method=POST
              filters:
                - IpRateLimit=email-verify, 10, 60
            # 계약 429: 가입·인증 코드 확인·재발송도 IP당 분당 10회(코드 맞히기·메일 폭탄 막기)
            - id: auth-email-resend
              uri: ${AUTH_SERVER_URL:http://auth-server:8080}
              order: -1
              predicates:
                - Path=/api/v1/auth/email/resend
                - Method=POST
              filters:
                - IpRateLimit=email-resend, 10, 60
            # 보안 점검(11/8): 비밀번호 재설정 요청(메일 발송)·재설정(6자리 코드 확인)도 IP당 분당 10회
            - id: auth-password-reset-request
              uri: ${AUTH_SERVER_URL:http://auth-server:8080}
              order: -1
              predicates:
                - Path=/api/v1/auth/password/reset-request
                - Method=POST
              filters:
                - IpRateLimit=password-reset-request, 10, 60
            - id: auth-password-reset
              uri: ${AUTH_SERVER_URL:http://auth-server:8080}
              order: -1
              predicates:
                - Path=/api/v1/auth/password/reset
                - Method=POST
              filters:
                - IpRateLimit=password-reset, 10, 60
            # 소셜 로그인 시작·콜백(11/10, contracts 소셜 로그인): 브라우저 이동이라 IP당 분당 30회(행사장 같은 IP 여러 명)
            - id: auth-oauth
              uri: ${AUTH_SERVER_URL:http://auth-server:8080}
              order: -1
              predicates:
                - Path=/api/v1/auth/oauth/*/start,/api/v1/auth/oauth/*/callback
                - Method=GET
              filters:
                - IpRateLimit=oauth, 30, 60
            # 공개 보유 기기 목록·상세(11/8, contracts #33): 로그인 없이 열리므로 IP당 분당 300회(행사장은 여러 사람이 같은 IP라 넉넉히). 서버별 라우트보다 먼저 맞도록 order를 낮춘다
            - id: catalog-devices
              uri: ${RENTAL_SERVER_URL:http://rental-server:8080}
              order: -1
              predicates:
                - Path=/api/v1/catalog/devices
                - Method=GET
              filters:
                - IpRateLimit=catalog, 300, 60
            - id: catalog-captures
              uri: ${CAPTURE_SERVER_URL:http://capture-server:8080}
              order: -1
              predicates:
                - Path=/api/v1/captures/catalog,/api/v1/captures/catalog/**
                - Method=GET
              filters:
                - IpRateLimit=catalog, 300, 60
            - id: catalog-diagnostics
              uri: ${DIAGNOSTICS_SERVER_URL:http://diagnostics-server:8080}
              order: -1
              predicates:
                - Path=/api/v1/diagnostics/catalog
                - Method=GET
              filters:
                - IpRateLimit=catalog, 300, 60
            - id: auth
              uri: ${AUTH_SERVER_URL:http://auth-server:8080}
              predicates:
                - Path=/api/v1/auth/**
            - id: rental
              uri: ${RENTAL_SERVER_URL:http://rental-server:8080}
              predicates:
                - Path=/api/v1/rentals/**,/api/v1/devices/**,/api/v1/device-models/**,/api/v1/pilot/**
            - id: capture
              uri: ${CAPTURE_SERVER_URL:http://capture-server:8080}
              predicates:
                - Path=/api/v1/captures/**
            - id: diagnostics
              uri: ${DIAGNOSTICS_SERVER_URL:http://diagnostics-server:8080}
              predicates:
                - Path=/api/v1/diagnostics/**
            - id: report
              uri: ${REPORT_SERVER_URL:http://report-server:8080}
              predicates:
                - Path=/api/v1/reports/**,/api/v1/verify/**
            # 사이트 도우미 챗봇(11/10, contracts #39): 로그인 없이 열고, 요청 제한은 chat-server가 사용자·IP당 분당 20개로 건다.
            # 공개 경로라 토큰은 검사하지 않지만 Authorization은 그대로 넘긴다(chat-server가 그 토큰으로 내 렌탈을 GET한다)
            - id: chat
              uri: ${CHAT_SERVER_URL:http://chat-server:8080}
              predicates:
                - Path=/api/v1/chat,/api/v1/chat/**

trace:
  security:
    # auth-server 공개키(클러스터 안에서만 연다). kid로 키를 바꿔도 다시 받아 온다
    jwk-set-uri: ${AUTH_SERVER_URL:http://auth-server:8080}/.well-known/jwks.json
    issuer: ${TRACE_JWT_ISSUER:trace}
    # CORS로 허용할 web 출처(쉼표로 여러 개). 도메인을 사면 gitops infra.env에 넣는다
    web-origins: ${TRACE_WEB_ORIGIN:http://localhost:5173}
  redis:
    key-prefix: ${REDIS_KEY_PREFIX:trace:}
  upstream:
    # 뒤쪽 서버 이름(IP)을 기억하는 시간. 무중단 교체 때 새 컨테이너를 이 시간 안에 찾는다
    dns-ttl: ${TRACE_UPSTREAM_DNS_TTL:5s}
  rate-limit:
    # 앞단 프록시가 넣는 실제 사용자 IP 헤더. 학교 클러스터는 Cloudflare 뒤라 gitops infra.env에서 CF-Connecting-IP로 켠다
    client-ip-header: ${TRACE_CLIENT_IP_HEADER:}

app:
  commit: ${APP_COMMIT:unknown}   # 이미지에 구운 커밋 SHA. /ping 응답에 실려 배포 확인에 쓴다

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false   # Redis가 죽어도 gateway는 살아 있어야 한다(요청 제한만 꺼짐)   # /actuator/health/liveness·readiness (쿠버네티스 프로브)
