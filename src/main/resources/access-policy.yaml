  roles: [AGENT]
  scope: CHECKPOINT
  captureToken: false
- method: GET
  path: /api/v1/diagnostics/checkpoints/{checkpointId}
  roles: [ADMIN, CUSTOMER]
  scope: OWN_RENTAL
  captureToken: false
- {method: GET, path: /api/v1/rentals/ping, public: true}
- method: GET
  path: /api/v1/rentals
  roles: [ADMIN, CUSTOMER]
  scope: NONE
  captureToken: false
- method: POST
  path: /api/v1/rentals
  roles: [ADMIN]
  scope: NONE
  captureToken: false
- method: GET
  path: /api/v1/rentals/{rentalId}
  roles: [ADMIN, CUSTOMER]
  scope: OWN_RENTAL
  captureToken: false
- method: POST
  path: /api/v1/rentals/{rentalId}/checkpoints
