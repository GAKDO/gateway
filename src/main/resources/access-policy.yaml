  path: /api/v1/device-models
  roles: [ADMIN]
  scope: NONE
  captureToken: false
- method: GET
  path: /api/v1/device-models/{modelCode}
  roles: [ADMIN, CUSTOMER]
  scope: NONE
  captureToken: false
- method: PUT
