  scope: OWN_RENTAL
  captureToken: false
- method: GET
  path: /api/v1/captures/checkpoints/{checkpointId}/media
  roles: [ADMIN, CUSTOMER]
  scope: OWN_RENTAL
  captureToken: false
- {method: GET, path: /api/v1/diagnostics/ping, public: true}
- method: POST
